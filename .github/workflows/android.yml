name: HyperChanger - Github Actions Building

on:
push:
branches: [main]
pull_request:
branches: [main]

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Set up JDK 21
    uses: actions/setup-java@v4
    with:
      java-version: '21'
      distribution: temurin
      cache: gradle

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android NDK r28c
    run: sdkmanager --install "ndk;28.2.13676358"

  - name: Configure project NDK path
    shell: bash
    run: |
      set -euo pipefail
      NDK_DIR="${ANDROID_HOME}/ndk/28.2.13676358"
      test -f "${NDK_DIR}/source.properties"
      mkdir -p .build-tmp
      rm -rf .build-tmp/android-ndk-r28c
      ln -s "${NDK_DIR}" .build-tmp/android-ndk-r28c
      test -f .build-tmp/android-ndk-r28c/source.properties

  - name: Grant execute permission for gradlew
    run: chmod +x gradlew

  - name: Build with Gradle
    run: ./gradlew assembleDebug

  - name: Upload Debug APK
    uses: actions/upload-artifact@v4
    with:
      name: HyperChanger-debug
      path: app/build/outputs/apk/debug/*.apk

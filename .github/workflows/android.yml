name: HyperChanger - Github Actions Building

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Setup Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-37" \
            "cmake;3.22.1" \
            "ndk;28.2.13676358"

      - name: Verify Android SDK, CMake, and NDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "Android SDK path is not set."
            exit 1
          fi

          NDK_DIR="$SDK_ROOT/ndk/28.2.13676358"
          CMAKE_DIR="$SDK_ROOT/cmake/3.22.1"

          test -f "$NDK_DIR/source.properties"
          test -x "$CMAKE_DIR/bin/cmake"
          test -d "$SDK_ROOT/platforms/android-37"

          echo "NDK version:"
          grep -E '^(Pkg.Desc|Pkg.Revision)' "$NDK_DIR/source.properties"

          echo "CMake version:"
          "$CMAKE_DIR/bin/cmake" --version

      - name: Configure project NDK path
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          NDK_DIR="$SDK_ROOT/ndk/28.2.13676358"

          mkdir -p .build-tmp
          rm -rf .build-tmp/android-ndk-r28c
          ln -s "$NDK_DIR" .build-tmp/android-ndk-r28c

          test -f .build-tmp/android-ndk-r28c/source.properties
          readlink -f .build-tmp/android-ndk-r28c

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit | grep -q .
          ls -lh app/build/outputs/apk/debug/*.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HyperChanger-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

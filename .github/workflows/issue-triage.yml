name: Validate Issue Reports

on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue-triage-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      # Always load trusted code from the default branch, never an Issue author's ref.
      - name: Checkout triage implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github

      - name: Test validation and moderation paths
        run: node --test .github/scripts/issue-triage.test.cjs

      - name: Validate report and close incomplete issues
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { triageIssue } = require('./.github/scripts/issue-triage.cjs');
            if (context.eventName === 'workflow_dispatch') {
              await github.rest.issues.listLabelsForRepo({ ...context.repo, per_page: 1 });
              core.info('Cloud self-test passed: scripts loaded and Issues API is accessible. No Issues were modified.');
              return;
            }
            await triageIssue({ github, context, core });

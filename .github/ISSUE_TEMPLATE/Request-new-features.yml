name: 请求新功能
description: 
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        感谢您对HyperChanger提出想法！

  - type: input
    id: features
    attributes:
      label: 新功能名称
      description: 新功能名称
      placeholder: 例如：IOS音乐磁贴
    validations:
      required: true

  - type: input
    id: hyperos-version
    attributes:
      label: 大致效果描述
      description: 请精细的描述您想要的功能
    validations:
      required: true
      
